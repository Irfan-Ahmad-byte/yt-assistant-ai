
services:
  postgresql-server:
    image: bitnami/postgresql:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysupersecretpassword
      POSTGRES_DB: assistant
    networks:
      - yt-ai-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      
  backend-yt-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgresql-server:
        condition: service_healthy
    networks:
      - yt-ai-net
    ports:
      - 81:8001

  frontend-yt-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - yt-ai-net
    ports:
      - 80:3000

networks:
  yt-ai-net:
    driver: bridge
